<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ajandam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#101010;--tx:#fff;--mut:#9a9a9a;--line:#2b2b2b;--acc:#3b82f6;
  --cy:#dcc57a;--cb:#7fa8e0;--cr:#e08585;--cg:#82c59a;
  --ok:var(--cg);--red:var(--cr);--danger:var(--cr)}
select option{background:#101010;color:#fff}
*{box-sizing:border-box;text-transform:lowercase}
body{margin:0;font:15px/1.5 "Google Sans Code",ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
[hidden]{display:none!important}

/* giriş */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;display:grid;gap:10px}
.lbox h1{margin:0 0 4px;font-size:22px}
#lmsg{color:var(--danger);font-size:13px;min-height:18px}
.link{background:none;border:none;color:var(--acc);padding:0;text-align:left}

/* yerleşim */
#app{display:grid;grid-template-columns:300px 1fr;height:100vh}
.side{overflow:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pane{display:flex;flex-direction:column;min-width:0;height:100vh}
.bar{display:none;padding:8px 70px 8px 12px;border-bottom:1px solid var(--line)}
.main{overflow:auto;padding:56px 16px 16px;min-width:0;flex:1}
.empty{color:var(--mut);margin-top:30vh;text-align:center}

/* sol üst: ekle + yeni klasör */
.addbtn{background:none;border:none;padding:0;text-align:left;font-weight:800;font-size:20px;width:max-content}
.addbtn:hover{border:none;color:var(--acc)}
.nf{display:block;cursor:pointer;font-weight:400;padding:2px 0 14px;width:max-content}
.nf:hover{color:var(--acc)}
.nfi{padding:4px 8px;margin:2px 0 14px}

/* klasörler: yazı şeklinde */
.fh{display:flex;align-items:center;gap:4px;padding:3px 0}
.fh .nm{cursor:pointer;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .nm.on{font-weight:800}
.fh .nm.red,.ent.red{color:var(--red)}
.fh .nm.green,.ent.green{color:var(--ok)}
.fh .sp{flex:1}
.fh .pen{padding:0 4px;color:var(--mut)}
.fh .rn{width:170px;padding:2px 6px;font-weight:800}
.fh button{padding:2px 6px;border:none;background:none;color:var(--mut)}
.fh button:hover{color:var(--tx)}
.ent{padding:3px 0 3px 18px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent:hover{opacity:.75}
.ent.on{font-weight:800}
.out{margin-top:auto;padding-top:28px;color:var(--mut);font-size:13px;cursor:pointer;width:max-content}

/* not editörü */
.head{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.head input.t{font-size:20px;font-weight:700;flex:1;min-width:200px}
.head select{width:auto}
.block{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}
.tools button{padding:1px 8px;font-size:13px}
.block img{max-width:100%;border-radius:8px;display:block}

/* zengin yazı alanı (sadece renk) */
.rich{outline:none;min-height:60px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.rich:empty::before{content:attr(data-ph);color:var(--mut);pointer-events:none}
.rich .cy{color:var(--cy)} .rich .cb{color:var(--cb)} .rich .cr{color:var(--cr)} .rich .cg{color:var(--cg)}

.ti{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ti input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--ok)}
.ti .tt{flex:1;min-width:0;min-height:0;padding:4px 6px;border-radius:6px}
.ti .tt:focus{background:var(--bg)}
.ti .tt.done{text-decoration:line-through;color:var(--mut)}
.ti button{border:none;background:none;padding:2px 6px;color:var(--mut)}
.xl{resize:both;overflow:auto;max-width:100%;min-width:140px;min-height:90px;height:260px;border:1px solid var(--line);border-radius:8px}
.xl table{border-collapse:collapse;font-size:13px;white-space:nowrap}
.xl td{border:1px solid var(--line);padding:3px 8px}
.xl tr:first-child td{position:sticky;top:0;background:var(--card);font-weight:600}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 60px}

/* renk araç çubuğu */
#ctb{position:fixed;z-index:40;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#1a1a1a;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 18px #000a}
#ctb button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #000}
#ctb button:hover{border-color:#fff}
#ctb button.clr{background:none;border:1px solid var(--mut);color:var(--mut);font-size:13px;line-height:1}

/* arama */
#sbtn{position:fixed;top:10px;right:12px;z-index:20;padding:4px 10px}
#search{position:fixed;inset:0;background:#000;z-index:30;padding:14px;overflow:auto}
.sbar{display:flex;gap:8px;position:sticky;top:-14px;background:#000;padding:14px 0 10px;margin-top:-14px}
#q{font-size:16px}
.res{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;opacity:.55}
.res:hover{opacity:1}
.res .rt{font-size:12px;color:var(--mut)}
.res .rs{word-break:break-word}
.res mark{background:none;color:#fff;font-weight:800}
.snote{color:var(--mut);font-size:13px;padding:8px 4px}

@media(max-width:800px){
  #app{display:block}
  .side{height:100vh;width:100%}
  .pane{display:none}
  #app.edit .side{display:none}
  #app.edit .pane{display:flex}
  .bar{display:block}
  .main{padding-top:16px}
}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lform">
    <h1>📒 ajandam</h1>
    <input id="lmail" type="email" placeholder="e-posta" autocomplete="username" autocapitalize="none" required>
    <input id="lpass" type="password" placeholder="şifre" autocomplete="current-password" autocapitalize="none" minlength="6" required>
    <button class="pri" id="lgo">giriş yap</button>
    <button type="button" class="link" id="lswitch">ilk kez mi? hesap oluştur</button>
    <button type="button" class="link" id="lreset">şifremi unuttum</button>
    <div id="lmsg"></div>
  </form>
</div>

<div id="app" hidden>
  <aside class="side" id="side">
    <button class="addbtn" id="addBtn">ekle</button>
    <div id="nfbox"></div>
    <div id="tree"></div>
    <div class="out" id="logout">çıkış yap</div>
  </aside>
  <div class="pane">
    <div class="bar"><button id="back">← geri</button></div>
    <main class="main" id="main"><div class="empty">soldan bir not seç ya da yeni not ekle.</div></main>
  </div>

  <button id="sbtn" title="ara">🔍</button>
  <div id="search" hidden>
    <div class="sbar"><input id="q" placeholder="ara: görev, metin, excel…" autocomplete="off" autocapitalize="none"><button id="sx">✕</button></div>
    <div id="sres"></div>
  </div>
</div>

<div id="ctb" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== firebase ayarları ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAUDn8_Z2XFxiArUM1_POH3yaelXZA01EM",
  authDomain: "ajanda-ac688.firebaseapp.com",
  projectId: "ajanda-ac688",
  appId: "1:829199801396:web:35fd2805780ba357487e61"
};
/* =============================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  if (tag === 'input' || tag === 'textarea') e.setAttribute('autocapitalize', 'none');
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  kids.flat().filter(x => x != null && x !== false).forEach(c => e.append(c));
  return e;
};
const debounce = (fn, ms = 600) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lc = s => String(s).toLocaleLowerCase('tr');

window.addEventListener('unhandledrejection', ev => alert('hata: ' + ((ev.reason && ev.reason.message) || ev.reason)));

let uid = null, folders = [], entries = [], openF = new Set(), cur = null, blocks = [], unsubs = [], seeded = false;

/* ---------- giriş ---------- */
let signup = false;
$('#lswitch').onclick = () => {
  signup = !signup;
  $('#lgo').textContent = signup ? 'hesap oluştur' : 'giriş yap';
  $('#lswitch').textContent = signup ? 'zaten hesabım var' : 'ilk kez mi? hesap oluştur';
  $('#lpass').autocomplete = signup ? 'new-password' : 'current-password';
};
$('#lreset').onclick = async () => {
  const m = $('#lmail').value.trim();
  if (!m) return msg('önce e-posta yaz.');
  try { await sendPasswordResetEmail(auth, m); msg('sıfırlama bağlantısı e-postana gönderildi.', true); } catch (e) { msg(err(e)); }
};
$('#lform').onsubmit = async ev => {
  ev.preventDefault(); msg('');
  const m = $('#lmail').value.trim(), p = $('#lpass').value;
  try { signup ? await createUserWithEmailAndPassword(auth, m, p) : await signInWithEmailAndPassword(auth, m, p); }
  catch (e) { msg(err(e)); }
};
function msg(t, ok) { const x = $('#lmsg'); x.textContent = t; x.style.color = ok ? 'var(--ok)' : 'var(--danger)'; }
function err(e) {
  const c = e.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'e-posta veya şifre hatalı.';
  if (c.includes('email-already')) return 'bu e-posta zaten kayıtlı.';
  if (c.includes('weak-password')) return 'şifre en az 6 karakter olmalı.';
  if (c.includes('too-many')) return 'çok fazla deneme. biraz bekle.';
  return e.message;
}
$('#logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (!user) { uid = null; $('#app').hidden = true; $('#login').hidden = false; $('#lpass').value = ''; return; }
  uid = user.uid; $('#login').hidden = true; $('#app').hidden = false;
  cur = null; blocks = []; seeded = false; showEmpty(); showEditor(false);
  unsubs.push(onSnapshot(query(collection(db, 'users', uid, 'folders'), orderBy('createdAt')), s => {
    folders = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!folders.length && !seeded) { seeded = true; addDoc(collection(db, 'users', uid, 'folders'), { name: 'genel', createdAt: Date.now() }); }
    renderTree();
  }, e => alert('veri okunamadı: ' + e.message)));
  unsubs.push(onSnapshot(query(collection(db, 'users', uid, 'entries'), orderBy('createdAt', 'desc')), s => {
    entries = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTree();
  }));
});

/* ---------- referanslar ---------- */
const fCol = () => collection(db, 'users', uid, 'folders');
const eCol = () => collection(db, 'users', uid, 'entries');
const eDoc = id => doc(db, 'users', uid, 'entries', id);
const bCol = id => collection(db, 'users', uid, 'entries', id, 'blocks');
const bDoc = (eid, bid) => doc(db, 'users', uid, 'entries', eid, 'blocks', bid);

function showEditor(on) { $('#app').classList.toggle('edit', on); }
$('#back').onclick = () => showEditor(false);

/* ---------- yeni klasör (sol üst) ---------- */
let addingFolder = false;
function startNewFolder() { addingFolder = true; renderNF(); }
function renderNF() {
  const box = $('#nfbox'); box.replaceChildren();
  if (!addingFolder) { box.append(h('span', { class: 'nf', onclick: startNewFolder }, 'yeni klasör')); return; }
  const inp = h('input', { class: 'nfi', placeholder: 'klasör adı…' });
  let done = false;
  const fin = async ok => {
    if (done) return; done = true; addingFolder = false;
    const n = lc(inp.value.trim()); renderNF();
    if (ok && n) await createFolder(n);
  };
  inp.onkeydown = e => { if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
  inp.onblur = () => fin(true);
  box.append(inp); setTimeout(() => inp.focus(), 0);
}
async function createFolder(name) {
  try {
    const r = await addDoc(fCol(), { name, createdAt: Date.now() });
    openF.add(r.id); renderTree();
  } catch (e) { alert('klasör eklenemedi: ' + e.message); }
}
$('#addBtn').onclick = startNewFolder;
renderNF();

/* ---------- klasör ağacı ---------- */
let renaming = null;
function renderTree() {
  const t = $('#tree'); t.replaceChildren();
  folders.forEach(f => {
    const list = entries.filter(e => e.folderId === f.id);
    const isOpen = openF.has(f.id);
    const tot = list.reduce((a, e) => a + (e.tTotal || 0), 0), dn = list.reduce((a, e) => a + (e.tDone || 0), 0);
    const col = tot ? (dn < tot ? ' red' : ' green') : '';
    let nameEl;
    if (renaming === f.id) {
      nameEl = h('input', { class: 'rn', value: f.name });
      const fin = async ok => {
        if (renaming !== f.id) return;
        renaming = null;
        const n = lc(nameEl.value.trim());
        if (ok && n && n !== f.name) await updateDoc(doc(db, 'users', uid, 'folders', f.id), { name: n });
        else renderTree();
      };
      nameEl.onkeydown = e => { if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
      nameEl.onblur = () => fin(true);
      setTimeout(() => { nameEl.focus(); nameEl.select(); }, 0);
    } else {
      nameEl = h('span', { class: 'nm' + (isOpen ? ' on' : '') + col, onclick: () => { isOpen ? openF.delete(f.id) : openF.add(f.id); renderTree(); } },
        (isOpen ? '▾ ' : '▸ ') + f.name + (tot ? ` (${dn}/${tot})` : ''));
    }
    const head = h('div', { class: 'fh' },
      nameEl,
      isOpen && renaming !== f.id ? h('button', { class: 'pen', title: 'adı değiştir', onclick: () => { renaming = f.id; renderTree(); } }, '✎') : null,
      h('span', { class: 'sp' }),
      h('button', { title: 'yeni not', onclick: () => newEntry(f.id) }, '＋'),
      h('button', { title: 'sil', onclick: () => delFolder(f, list) }, '🗑'));
    const box = h('div', { class: 'folder' }, head);
    if (isOpen) list.forEach(e => {
      const c = e.tTotal ? (e.tDone < e.tTotal ? ' red' : ' green') : '';
      box.append(h('div', { class: 'ent' + (cur && cur.id === e.id ? ' on' : '') + c, onclick: () => openEntry(e.id) },
        (e.title || 'başlıksız') + (e.tTotal ? ` (${e.tDone || 0}/${e.tTotal})` : '')));
    });
    t.append(box);
  });
}

async function newEntry(folderId) {
  const r = await addDoc(eCol(), { folderId, title: 'yeni not', createdAt: Date.now() });
  openF.add(folderId);
  for (let i = 0; i < 20 && !entries.find(e => e.id === r.id); i++) await new Promise(r => setTimeout(r, 100));
  openEntry(r.id);
}
async function delFolder(f, list) {
  if (!confirm(`"${f.name}" klasörü ve içindeki ${list.length} not silinsin mi?`)) return;
  for (const e of list) await removeEntry(e.id);
  await deleteDoc(doc(db, 'users', uid, 'folders', f.id));
}
async function removeEntry(id) {
  const s = await getDocs(bCol(id));
  const b = writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); b.delete(eDoc(id)); await b.commit();
  if (cur && cur.id === id) { cur = null; showEmpty(); showEditor(false); }
}

/* ---------- zengin yazı: sadece renk ---------- */
const PAL = [['cy', '#dcc57a', 'sarı'], ['cb', '#7fa8e0', 'mavi'], ['cr', '#e08585', 'kırmızı'], ['cg', '#82c59a', 'yeşil']];
const probe = document.createElement('span');
const rgbOf = v => { probe.style.color = ''; probe.style.color = v; return probe.style.color; };
const PALRGB = PAL.map(p => rgbOf(p[1]));

function colorClassOf(n) {
  if (PAL.some(p => p[0] === n.className)) return n.className;
  const v = (n.style && n.style.color) || (n.getAttribute && n.getAttribute('color'));
  if (!v) return null;
  const i = PALRGB.indexOf(rgbOf(v));
  return i >= 0 ? PAL[i][0] : null;
}
// yalnızca düz yazı, satır sonu ve palet renkleri kalır; yazılar küçük harfe çevrilir
function clean(node) {
  const frag = document.createDocumentFragment();
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) frag.append(lc(n.textContent));
    else if (n.nodeType === 1) {
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') frag.append(document.createElement('br'));
      else if (tag === 'div' || tag === 'p') { const d = document.createElement('div'); d.append(clean(n)); frag.append(d); }
      else {
        const c = (tag === 'span' || tag === 'font') ? colorClassOf(n) : null;
        if (c) { const s = document.createElement('span'); s.className = c; s.append(clean(n)); frag.append(s); }
        else frag.append(clean(n));
      }
    }
  });
  return frag;
}
const cleanHtml = el => { const d = document.createElement('div'); d.append(clean(el)); return d.innerHTML; };
function loadRich(ed, html, plain) {
  if (html) { const t = document.createElement('template'); t.innerHTML = html; ed.append(...clean(t.content).childNodes); }
  else if (plain) ed.innerText = plain;
}
const readRich = ed => ({ html: cleanHtml(ed), value: lc(ed.innerText.replace(/\u00a0/g, ' ')).trim() });

function rich(ph, oneLine) {
  const e = h('div', { class: 'rich' });
  e.contentEditable = 'true'; e.spellcheck = false;
  e.setAttribute('autocapitalize', 'none'); e.setAttribute('data-ph', ph);
  e.addEventListener('paste', ev => {
    ev.preventDefault();
    let t = (ev.clipboardData || window.clipboardData).getData('text/plain');
    if (oneLine) t = t.replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, t);
  });
  return e;
}

// seçince çıkan renk çubuğu
const tb = $('#ctb');
let savedRange = null, activeEd = null, tbDown = false;
PAL.forEach(([, hex, name]) => {
  const b = h('button', { title: name, onclick: () => applyColor(hex) }); b.style.background = hex; tb.append(b);
});
tb.append(h('button', { class: 'clr', title: 'rengi kaldır', onclick: () => applyColor(null) }, '✕'));
tb.addEventListener('mousedown', e => { e.preventDefault(); tbDown = true; });
tb.addEventListener('touchstart', () => { tbDown = true; }, { passive: true });
tb.addEventListener('touchend', () => setTimeout(() => { tbDown = false; }, 700));

function applyColor(hex) {
  if (!activeEd || !savedRange) return;
  activeEd.focus({ preventScroll: true });
  const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange);
  document.execCommand('styleWithCSS', false, true);
  if (hex) document.execCommand('foreColor', false, hex); else document.execCommand('removeFormat');
  activeEd.dispatchEvent(new Event('input', { bubbles: true }));
  tbDown = false; s.collapseToEnd(); tb.hidden = true;
}
function updateTb() {
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) { if (!tbDown) tb.hidden = true; return; }
  const r = s.getRangeAt(0);
  const n = r.commonAncestorContainer;
  const ed = (n.nodeType === 3 ? n.parentElement : n).closest('.rich');
  if (!ed) { if (!tbDown) tb.hidden = true; return; }
  savedRange = r.cloneRange(); activeEd = ed;
  const rc = r.getBoundingClientRect();
  const coarse = matchMedia('(pointer:coarse)').matches;
  tb.hidden = false;
  const w = tb.offsetWidth, hg = tb.offsetHeight;
  let top = rc.top - hg - (coarse ? 70 : 10);
  if (top < 8) top = rc.bottom + (coarse ? 36 : 10);
  top = Math.min(top, innerHeight - hg - 8);
  const left = Math.max(8, Math.min(rc.left + rc.width / 2 - w / 2, innerWidth - w - 8));
  tb.style.top = top + 'px'; tb.style.left = left + 'px';
}
document.addEventListener('selectionchange', updateTb);
$('#main').addEventListener('scroll', updateTb);

/* ---------- not editörü ---------- */
function showEmpty() { $('#main').replaceChildren(h('div', { class: 'empty' }, 'soldan bir not seç ya da yeni not ekle.')); }

async function openEntry(id) {
  cur = entries.find(e => e.id === id); if (!cur) return;
  showEditor(true);
  const s = await getDocs(query(bCol(id), orderBy('order')));
  blocks = s.docs.map(d => ({ id: d.id, ...d.data() }));
  renderEditor(); renderTree();
}

function renderEditor() {
  tb.hidden = true;
  const m = $('#main'); m.replaceChildren();
  const title = h('input', { class: 't', value: cur.title || '', placeholder: 'başlık' });
  title.oninput = debounce(() => updateDoc(eDoc(cur.id), { title: lc(title.value.trim()) || 'başlıksız' }), 500);
  const sel = h('select', { title: 'klasör' }, folders.map(f => h('option', { value: f.id, selected: f.id === cur.folderId }, f.name)));
  sel.onchange = () => updateDoc(eDoc(cur.id), { folderId: sel.value });
  m.append(h('div', { class: 'head' }, title, sel, h('button', { onclick: async () => { if (confirm('bu not silinsin mi?')) removeEntry(cur.id); } }, '🗑 notu sil')));

  blocks.forEach((b, i) => m.append(renderBlock(b, i)));

  const fi = h('input', { type: 'file', accept: 'image/*', hidden: true, multiple: true });
  fi.onchange = async () => { for (const f of fi.files) await addBlock({ type: 'image', data: await toJpeg(f) }); fi.value = ''; };
  const fx = h('input', { type: 'file', accept: '.xlsx,.xls,.csv', hidden: true });
  fx.onchange = async () => { if (fx.files[0]) await addExcel(fx.files[0]); fx.value = ''; };
  m.append(h('div', { class: 'add' },
    h('button', { class: 'pri', onclick: () => addBlock({ type: 'text', value: '', html: '' }) }, '＋ metin'),
    h('button', { onclick: () => fi.click() }, '＋ resim'),
    h('button', { onclick: () => fx.click() }, '＋ excel'),
    h('button', { onclick: () => addBlock({ type: 'tasks', items: [{ t: '', h: '', d: false }] }) }, '☑ görev listesi'), fi, fx));
}

function renderBlock(b, i) {
  const tools = h('div', { class: 'tools' },
    h('button', { onclick: () => moveBlock(i, -1) }, '↑'),
    h('button', { onclick: () => moveBlock(i, 1) }, '↓'),
    h('button', { onclick: async () => { if (!confirm('blok silinsin mi?')) return; await deleteDoc(bDoc(cur.id, b.id)); blocks.splice(i, 1); renderEditor(); syncStats(); } }, '🗑'));
  const w = h('div', { class: 'block' }, tools);

  if (b.type === 'text') {
    const ed = rich('yaz…');
    loadRich(ed, b.html, b.value);
    const save = debounce(() => { const r = readRich(ed); b.html = r.html; b.value = r.value; updateDoc(bDoc(cur.id, b.id), { html: r.html, value: r.value }); }, 600);
    ed.addEventListener('input', save);
    w.append(ed);
  } else if (b.type === 'image') {
    w.append(h('img', { src: b.data }));
  } else if (b.type === 'tasks') {
    b.items = b.items || [];
    const list = h('div', { class: 'tl' });
    const persist = async () => { await updateDoc(bDoc(cur.id, b.id), { items: b.items }); syncStats(); };
    const persistSoon = debounce(persist, 500);
    const draw = focusIdx => {
      list.replaceChildren();
      b.items.forEach((it, k) => {
        const cb = h('input', { type: 'checkbox', checked: !!it.d });
        const ed = rich('görev…', true); ed.classList.add('tt'); if (it.d) ed.classList.add('done');
        loadRich(ed, it.h, it.t);
        cb.onchange = () => { it.d = cb.checked; ed.classList.toggle('done', it.d); persist(); };
        ed.addEventListener('input', () => { const r = readRich(ed); it.t = r.value; it.h = r.html; persistSoon(); });
        ed.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); b.items.splice(k + 1, 0, { t: '', h: '', d: false }); draw(k + 1); } });
        const x = h('button', { title: 'görevi sil', onclick: () => { b.items.splice(k, 1); draw(); persist(); } }, '✕');
        list.append(h('div', { class: 'ti' }, cb, ed, x));
        if (focusIdx === k) setTimeout(() => ed.focus(), 0);
      });
    };
    draw();
    w.append(list, h('button', { onclick: () => { b.items.push({ t: '', h: '', d: false }); draw(b.items.length - 1); } }, '＋ görev'));
  } else if (b.type === 'excel') {
    const data = JSON.parse(b.json), names = Object.keys(data);
    const box = h('div', { class: 'xl' });
    if (b.w) box.style.width = b.w + 'px';
    if (b.h) box.style.height = b.h + 'px';
    const draw = n => {
      box.replaceChildren(h('table', {}, data[n].map(r => h('tr', {}, r.map(c => h('td', {}, String(c)))))));
    };
    if (names.length > 1) {
      const s = h('select', { style: 'width:auto;margin-bottom:6px' }, names.map(n => h('option', {}, n)));
      s.onchange = () => draw(s.value); w.append(s);
    }
    draw(names[0]); w.append(box);
    let first = true;
    const saveSize = debounce(() => updateDoc(bDoc(cur.id, b.id), { w: Math.round(box.offsetWidth), h: Math.round(box.offsetHeight) }), 700);
    new ResizeObserver(() => { if (first) { first = false; return; } saveSize(); }).observe(box);
  }
  return w;
}

function syncStats() {
  let tTotal = 0, tDone = 0;
  blocks.forEach(b => { if (b.type === 'tasks') (b.items || []).forEach(i => { if ((i.t || '').trim()) { tTotal++; if (i.d) tDone++; } }); });
  return updateDoc(eDoc(cur.id), { tTotal, tDone });
}

async function addBlock(data) {
  const order = Date.now();
  const r = await addDoc(bCol(cur.id), { ...data, order });
  blocks.push({ id: r.id, ...data, order }); renderEditor();
  $('#main').scrollTo(0, $('#main').scrollHeight);
}

async function moveBlock(i, d) {
  const j = i + d; if (j < 0 || j >= blocks.length) return;
  const a = blocks[i], b = blocks[j];
  const bt = writeBatch(db);
  bt.update(bDoc(cur.id, a.id), { order: b.order }); bt.update(bDoc(cur.id, b.id), { order: a.order });
  await bt.commit();
  [a.order, b.order] = [b.order, a.order]; blocks.sort((x, y) => x.order - y.order); renderEditor();
}

/* ---------- resim / excel işleme ---------- */
async function toJpeg(file, max = 1000) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let q = .78, d = c.toDataURL('image/jpeg', q);
  while (d.length > 900000 && q > .3) { q -= .1; d = c.toDataURL('image/jpeg', q); }
  return d;
}

async function addExcel(file) {
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const sheets = {};
    wb.SheetNames.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false }); });
    const json = JSON.stringify(sheets);
    if (json.length > 900000) return alert('excel çok büyük (≈900 kb sınırı). sayfayı küçültüp tekrar dene.');
    await addBlock({ type: 'excel', name: file.name, json });
  } catch (e) { alert('excel okunamadı: ' + e.message); }
}

/* ---------- arama (başlık, metin, görev, excel hepsi) ---------- */
const norm = s => String(s).replace(/[İIı]/g, 'i').replace(/[çÇ]/g, 'c').replace(/[şŞ]/g, 's')
  .replace(/[ğĞ]/g, 'g').replace(/[öÖ]/g, 'o').replace(/[üÜ]/g, 'u').toLowerCase();

let sIdx = [], sBusy = false;

async function buildIndex() {
  const out = [];
  await Promise.all(entries.map(async e => {
    const s = await getDocs(bCol(e.id));
    s.docs.forEach(d => {
      const b = d.data();
      if (b.type === 'text' && b.value) out.push({ eid: e.id, kind: 'metin', t: b.value });
      else if (b.type === 'tasks') (b.items || []).forEach(i => { if (i.t) out.push({ eid: e.id, kind: 'görev' + (i.d ? ' ✓' : ''), t: i.t }); });
      else if (b.type === 'excel') {
        try {
          Object.values(JSON.parse(b.json)).forEach(rows => rows.forEach(r => {
            const line = r.join(' | ').trim();
            if (line.replace(/\|/g, '').trim()) out.push({ eid: e.id, kind: 'excel', t: line });
          }));
        } catch (_) {}
      }
    });
  }));
  return out;
}

async function openSearch() {
  $('#search').hidden = false; $('#q').value = ''; $('#q').focus();
  sBusy = true; runSearch();
  try { sIdx = await buildIndex(); } finally { sBusy = false; }
  runSearch();
}
function snippet(t, q) {
  t = String(t).replace(/\s+/g, ' ');
  const i = norm(t).indexOf(q);
  if (i < 0) return t.slice(0, 100);
  const a = Math.max(0, i - 35), b = Math.min(t.length, i + q.length + 60);
  return [a > 0 ? '…' : '', t.slice(a, i), h('mark', {}, t.slice(i, i + q.length)), t.slice(i + q.length, b), b < t.length ? '…' : ''];
}
function runSearch() {
  const box = $('#sres'); box.replaceChildren();
  const note = t => h('div', { class: 'snote' }, t);
  const q = norm($('#q').value.trim());
  if (!q) return box.append(note(sBusy ? 'taranıyor…' : 'aramak için yazmaya başla.'));
  const items = [];
  folders.forEach(f => { if (norm(f.name).includes(q)) items.push({ kind: 'klasör', t: f.name, fid: f.id }); });
  entries.forEach(e => { if (norm(e.title || '').includes(q)) items.push({ kind: 'başlık', t: e.title || '', eid: e.id }); });
  sIdx.forEach(x => { if (norm(x.t).includes(q)) items.push(x); });
  if (sBusy) box.append(note('taranıyor…'));
  if (!items.length) { if (!sBusy) box.append(note('sonuç yok.')); return; }
  items.slice(0, 80).forEach(x => {
    const e = x.eid ? entries.find(en => en.id === x.eid) : null;
    const f = e ? folders.find(fo => fo.id === e.folderId) : null;
    const where = x.kind === 'klasör' ? 'klasör' : `${f ? f.name + ' / ' : ''}${e ? (e.title || 'başlıksız') : ''} · ${x.kind}`;
    box.append(h('div', { class: 'res', onclick: () => gotoResult(x) }, h('div', { class: 'rt' }, where), h('div', { class: 'rs' }, snippet(x.t, q))));
  });
  if (items.length > 80) box.append(note(`+${items.length - 80} sonuç daha, aramayı daralt.`));
}
function gotoResult(x) {
  $('#search').hidden = true;
  if (x.kind === 'klasör') { openF.add(x.fid); showEditor(false); renderTree(); return; }
  const e = entries.find(en => en.id === x.eid);
  if (e) { openF.add(e.folderId); openEntry(e.id); }
}
$('#sbtn').onclick = openSearch;
$('#sx').onclick = () => { $('#search').hidden = true; };
$('#q').oninput = runSearch;
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#search').hidden = true; });
</script>
